/* Layout: Bauhaus module grid on cool plaster. 2px ink rules divide space, one rounded "balcony" corner marks a module,
   numbers become shapes: filled = Israel, outline = OECD average, colour = topic. */
:root{
  --paper:#E9ECEF;--card:#F4F5F7;--ink:#171717;--ink2:#3A3D42;--ink3:#585D64;--stone:#C5CBD3;--stone2:#D9DEE4;
  --bar:#7D8590;--redtx:#A8321C;--red:#D9442B;--blu:#2347B2;--sky:#C9D4EC;--blush:#F2D6CE;--mist:#CDD3DA;--onink:#E9ECEF;--onblu:#FFFFFF;
  --r1:#DCE3F3;--r2:#B4C3E7;--r3:#7F98D6;--r4:#4767BF;--r5:#1E3D99;--rt-lo:#171717;--rt-hi:#FFFFFF;
  --disp:'Alef','Arial Hebrew','Noto Sans Hebrew',Arial,sans-serif;
  --text:'JostDigits','Alef','Arial Hebrew','Noto Sans Hebrew',Arial,sans-serif;
  --num:'Jost','Futura','Avenir Next','Segoe UI',Arial,sans-serif;
  --line:2px solid var(--ink);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14161A;--card:#1C1F24;--ink:#E7E9EC;--ink2:#C3C8CF;--ink3:#979DA6;--stone:#3D434B;--stone2:#2A2F36;
  --cur:#3A4F8F;--oncur:#E7E9EC;--bar:#727A85;--redtx:#F07A62;--red:#F07A62;--blu:#8AA2F4;--sky:#25335E;--blush:#45291F;--mist:#2F343C;--onink:#14161A;--onblu:#0D1226;
  --r1:#1E2843;--r2:#2C4076;--r3:#405DB1;--r4:#6F8CE6;--r5:#B4C5F7;--rt-lo:#E7E9EC;--rt-hi:#0D1226;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14161A;--card:#1C1F24;--ink:#E7E9EC;--ink2:#C3C8CF;--ink3:#979DA6;--stone:#3D434B;--stone2:#2A2F36;
  --cur:#3A4F8F;--oncur:#E7E9EC;--bar:#727A85;--redtx:#F07A62;--red:#F07A62;--blu:#8AA2F4;--sky:#25335E;--blush:#45291F;--mist:#2F343C;--onink:#14161A;--onblu:#0D1226;
  --r1:#1E2843;--r2:#2C4076;--r3:#405DB1;--r4:#6F8CE6;--r5:#B4C5F7;--rt-lo:#E7E9EC;--rt-hi:#0D1226;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:16.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
bdi{white-space:nowrap}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blu);outline-offset:3px}
.wrap{max-width:1320px;margin-inline:auto;padding-inline:40px}
.num{font-family:var(--num);font-weight:500;letter-spacing:-.01em;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.dh{font-family:var(--disp);font-weight:700;letter-spacing:-.02em;line-height:1.02;text-wrap:balance}
.src{font-size:13.5px;color:var(--ink3);margin:0}
.lnk{font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.lnk i{display:block;width:18px;height:3px;background:var(--ink);border-radius:2px}
.lnk:hover span,a:hover > .lnk span{text-decoration:underline;text-underline-offset:4px}
.skip{position:absolute;inset-inline-start:12px;top:-60px;z-index:80;background:var(--ink);color:var(--onink);padding:10px 16px;border-radius:99px;font-weight:700;text-decoration:none}
.skip:focus{top:12px}
.deep-only{display:none !important}
body.deep .deep-only{display:revert !important}
body.deep .deep-only.flexy{display:flex !important}
body.deep .srow.deep-only{display:grid !important}
body.deep .wl small.deep-only,body.deep .sl small.deep-only{display:block !important}
body.deep .brief-only{display:none !important}
svg text{font-family:var(--num)}

/* header */
.hd-row{display:flex;align-items:center;gap:24px;padding-block:16px 12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.bm{display:flex;align-items:flex-end;gap:3px}
.bn{font-family:var(--disp);font-weight:700;font-size:26px;line-height:1;white-space:nowrap}
.hd-tools{margin-inline-start:auto;display:flex;align-items:center;gap:12px}
.srch{position:relative;display:flex;align-items:center;gap:10px;height:42px;padding-inline:16px;border:var(--line);border-radius:99px;width:270px}
.srch input{all:unset;flex:1;min-width:0;font-size:15px;color:var(--ink)}
.srch input::placeholder{color:var(--ink3)}
.qres{position:absolute;top:calc(100% + 6px);inset-inline:-2px;z-index:40;background:var(--card);border:var(--line);border-radius:18px;padding:6px;display:flex;flex-direction:column;max-height:60vh;overflow:auto}
.qres a{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:12px;text-decoration:none;font-size:15px;line-height:1.3}
.qres a small{color:var(--ink3);font-size:13px;flex:0 0 auto}
.qres a.on,.qres a:hover{background:var(--stone2)}
.qres p{margin:6px 10px;font-size:14px;color:var(--ink3)}
.mode{display:flex;border:var(--line);border-radius:99px;padding:2px}
.mode button{all:unset;cursor:pointer;padding-inline:14px;height:34px;display:flex;align-items:center;font-weight:700;font-size:14px;border-radius:99px}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--onink)}
.thm{all:unset;cursor:pointer;width:42px;height:42px;border:var(--line);border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.mhint{margin:0;padding-block:0 10px;font-size:13.5px;color:var(--ink2)}
.hnav{border-top:var(--line)}
.hnav ul{list-style:none;margin:0;padding:0;display:flex;gap:26px;overflow-x:auto;scrollbar-width:none}
.hnav ul::-webkit-scrollbar{display:none}
.hnav a{display:block;padding-block:11px 8px;font-weight:700;font-size:15px;text-decoration:none;border-bottom:4px solid transparent;white-space:nowrap}
.hnav a[aria-current="page"]{border-bottom-color:var(--ink)}
.hnav a:hover{border-bottom-color:var(--stone)}
.rule{height:5px;background:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;height:50px;padding-inline:24px;font-weight:700;font-size:16px;border:var(--line);border-radius:99px;text-decoration:none;background:transparent;cursor:pointer}
.btn.p{background:var(--ink);color:var(--onink)}
.btn.s{height:38px;padding-inline:16px;font-size:14.5px}
.btn .dot{width:12px;height:12px;border-radius:50%;background:var(--red)}
.pill{all:unset;cursor:pointer;height:36px;padding-inline:14px;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;border:var(--line);border-radius:99px;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--onink)}
.pill:hover:not([aria-pressed="true"]){background:var(--stone2)}
.vpill{display:inline-flex;align-items:center;font-weight:700;font-size:13px;padding:3px 11px;border:var(--line);border-radius:99px;white-space:nowrap}
.vpill.f{background:var(--ink);color:var(--onink)}
.flag{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:3px 11px;border-radius:99px;white-space:nowrap}
.flag.break{border:2px solid var(--red);color:var(--redtx)}
.flag.tbreak{border:2px dashed var(--red);color:var(--redtx)}
.flag.caution{background:var(--blush);color:var(--ink)}
.flag.secondary{background:var(--mist);color:var(--ink)}
.flag.computed{background:var(--sky);color:var(--ink)}
.key{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--ink2)}
.key span{display:flex;align-items:center;gap:8px}
.key b.f{display:block;width:16px;height:16px;border-radius:50%;background:var(--blu)}
.key b.o{display:block;width:16px;height:16px;border-radius:50%;border:2.5px solid var(--ink)}
.key b.g{display:block;width:16px;height:16px;border-radius:50%;background:var(--red)}
.key b.s{display:block;width:16px;height:16px;border-radius:50%;background:var(--stone)}
.key b.l{display:block;width:4px;height:18px;background:var(--ink)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);border-bottom:var(--line)}
.ht{padding-block:52px 40px;padding-inline-end:40px;display:flex;flex-direction:column;gap:22px;border-inline-end:var(--line)}
.kick{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;color:var(--ink2)}
.kick i{display:block;flex:0 0 26px;height:4px;background:var(--red);border-radius:2px}
.ht h1{margin:0;font-size:clamp(56px,6.4vw,104px)}
.ht h1 span{display:block}
.ht h1 .ac{color:var(--blu)}
.lede{margin:0;font-size:19px;color:var(--ink2);max-width:30em}
.sub{margin:0;font-size:20px;font-weight:700;max-width:28em;line-height:1.35}
.byline{margin:0;display:flex;flex-wrap:wrap;gap:2px 0;font-size:13.5px;color:var(--ink2)}
.byline > * + *::before{content:'·';margin-inline:8px;color:var(--ink3)}
.byline a{font-weight:700;text-underline-offset:3px}
.ph .byline{font-size:13px}
.addr{user-select:text;-webkit-user-select:text;color:inherit;font-family:var(--num);direction:ltr;unicode-bidi:isolate;font-weight:600}
.tbd{outline:2px dashed var(--redtx);outline-offset:2px;color:var(--redtx)}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.hdeck{padding-block:32px;padding-inline-start:32px;min-width:0}

/* deck: behind the curtain */
.dk{border:var(--line);border-top-left-radius:64px;background:var(--card);display:flex;flex-direction:column;overflow:hidden}
.dk-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px 14px 60px;border-bottom:var(--line)}
.dk-name{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.dk-dots{display:flex;gap:5px;flex-wrap:wrap}
.dk-dots i{display:block;width:10px;height:10px;border-radius:50%;border:2px solid var(--ink3)}
.dk-dots i.s{background:var(--ink);border-color:var(--ink)}
.dk-dots i.c{background:var(--blu);border-color:var(--blu);transform:scale(1.3)}
.dk-q{padding:22px 24px 18px;display:flex;flex-direction:column;gap:12px}
.dk-tags{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dk-tag{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--ink2)}
.dk-qt{margin:0;font-family:var(--disp);font-weight:700;font-size:clamp(22px,2.2vw,31px);line-height:1.2;text-wrap:balance;max-width:24em}
.dk-g{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.dk-gl{font-size:14px;font-weight:700;color:var(--ink3);margin-inline-end:4px}
.gp{all:unset;cursor:pointer;min-height:38px;padding-inline:16px;display:inline-flex;align-items:center;border:var(--line);border-radius:99px;font-weight:700;font-size:15px}
.gp:hover:not([disabled]){background:var(--stone2)}
.gp.ok{background:var(--ink);color:var(--onink)}
.gp.no{border-color:var(--red);color:var(--redtx);text-decoration:line-through}
.gp[disabled]{cursor:default}
.dk-stage{position:relative;overflow:hidden;border-top:var(--line);min-height:430px;display:flex;flex-direction:column}
.dk-stage.shut{max-height:470px}
.dk-ans{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px 30px;padding:24px;flex:1;align-content:start}
.dk-ans:focus{outline:none}
.dk-a1{display:flex;flex-direction:column;gap:8px;min-width:0}
.dk-res{align-self:flex-start;font-weight:700;font-size:13.5px;padding:3px 12px;border-radius:99px;background:var(--ink);color:var(--onink)}
.dk-res.no{background:transparent;box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.dk-fl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:700}
.dk-big{font-size:clamp(56px,5.8vw,92px);line-height:.95;color:var(--blu);align-self:flex-start}
.dk-big.he{font-family:var(--disp);font-weight:700}
.dk-cap{margin:0;font-weight:700;font-size:17px;line-height:1.35}
.dk-line{margin:0;font-size:15.5px;color:var(--ink2)}
.dk-a2{display:flex;flex-direction:column;justify-content:center;gap:10px;min-width:0}
.dk-bh{grid-column:1/-1;background:var(--blush);padding:16px 20px;border-top-left-radius:30px}
.dk-bh b{display:block;font-size:14px;margin-bottom:4px}
.dk-bh p{margin:0;font-size:15.5px;color:var(--ink)}
.dk-ft{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap}
.dk-cur{position:absolute;inset:0;z-index:3;background-color:var(--cur,var(--blu));
  background-image:radial-gradient(circle at 50% 100%,var(--card) 11px,transparent 12px),repeating-linear-gradient(90deg,transparent 0 30px,rgba(0,0,0,.12) 30px 34px,rgba(255,255,255,.08) 34px 38px);
  background-size:28px 13px,auto;background-position:0 100%,0 0;background-repeat:repeat-x,repeat;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  transition:transform .75s cubic-bezier(.7,0,.2,1),visibility 0s linear 0s}
.dk-cur.open{transform:translateY(-101%);visibility:hidden;transition:transform .75s cubic-bezier(.7,0,.2,1),visibility 0s linear .75s}
.dk-rv{all:unset;cursor:pointer;width:136px;height:136px;border-radius:50%;background:var(--card);color:var(--ink);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:24px;box-shadow:0 0 0 7px rgba(0,0,0,.14)}
.dk-rv:hover{transform:scale(1.04)}
.dk-cur small{color:var(--oncur,var(--onblu));font-weight:700;font-size:14px;opacity:.9}
.dk-ctl{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;padding:16px 24px;border-top:var(--line)}
.dk-dice{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:12px;height:52px;padding-inline:12px 22px;border-radius:99px;background:var(--ink);color:var(--onink);font-weight:700;font-size:16px}
.die{display:block;width:30px;height:30px}
.dk-dice.roll .die{animation:roll .5s cubic-bezier(.3,.7,.3,1)}
@keyframes roll{from{transform:rotate(-200deg) scale(.7)}to{transform:none}}
.dk-hint{font-size:14px;color:var(--ink3)}
.dk-prev{all:unset;cursor:pointer;font-weight:700;font-size:14.5px;color:var(--ink2);margin-inline-start:auto}
.dk-prev:hover{text-decoration:underline;text-underline-offset:4px}

/* small visuals inside the deck and elsewhere */
.vb{display:flex;flex-direction:column;gap:10px;width:100%}
.vb-r{display:flex;flex-direction:column;gap:3px}
.vb-l{font-size:13.5px;font-weight:700;color:var(--ink2);line-height:1.3}
.vb-t{display:flex;align-items:center;gap:10px}
.vb-tr{flex:1;height:22px;position:relative;min-width:0}
.vb-tr i{position:absolute;top:0;bottom:0;right:0;border-radius:999px 0 0 999px;min-width:7px}
.vb-v{flex:0 0 auto;min-width:62px;font-size:17px;text-align:left}
i.il{background:var(--blu)}
i.il2{background:var(--sky);box-shadow:inset 0 0 0 2px var(--blu)}
i.oe{background:transparent;box-shadow:inset 0 0 0 2.5px var(--ink)}
i.ot{background:var(--stone)}
i.gr{background:var(--red)}
.vgrp{display:flex;flex-direction:column;gap:6px}
.vgrp + .vgrp{padding-top:10px;border-top:1px solid var(--stone)}
.vgrp > b{font-size:14px}
.vleg{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2)}
.vleg span{display:flex;align-items:center;gap:7px}
.vleg i{display:block;width:14px;height:14px;border-radius:50%}
.vfig{display:flex;flex-direction:column;gap:6px}
.vfig .fr{display:grid;grid-template-columns:repeat(15,13px);gap:5px 6px}
.vfig .fl{display:flex;align-items:baseline;gap:10px;font-size:14px;color:var(--ink2)}
.vfig .fl .num{font-size:22px;color:var(--ink)}
.vdots{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;max-width:240px}
.vdots i{display:block;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 2px var(--stone)}
.vdots i.il{box-shadow:none}

/* section heads */
.sh{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:end;gap:10px 40px;padding-block:56px 20px;border-bottom:var(--line)}
.sh h2{margin:0;font-size:clamp(38px,4vw,56px)}
.sh p{margin:0;font-size:16.5px;color:var(--ink2);max-width:42em}
.ph{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 30px;align-items:end;padding-block:30px;border-bottom:var(--line);overflow:hidden}
.ph .ig{position:absolute;left:-120px;top:-160px;pointer-events:none}
.ph > div{position:relative;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph h1{margin:0;font-size:clamp(46px,6vw,96px)}
.ph p{margin:0;font-size:18px;color:var(--ink2);max-width:42em}
.ph .tag{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.ph .side{position:relative;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.ph h1:focus,.ht h1:focus{outline:none}
.crumb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:700;padding-top:16px;color:var(--ink3)}
.crumb a{text-decoration:none}.crumb a:hover{text-decoration:underline}

/* one glance */
.gl{border:var(--line);border-top-left-radius:64px;background:var(--card);margin-top:24px;overflow:hidden}
.gl-tabs{display:flex;gap:8px;flex-wrap:wrap;padding:18px 24px 16px 64px;border-bottom:var(--line)}
.gt{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;height:42px;padding-inline:12px 16px;border:var(--line);border-radius:99px;font-weight:700;font-size:15px;white-space:nowrap}
.gt[aria-selected="true"]{background:var(--ink);color:var(--onink)}
.gt:hover:not([aria-selected="true"]){background:var(--stone2)}
.gl-hd{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center;padding:24px 24px 14px}
.gl-hd h3{margin:0;font-family:var(--disp);font-size:38px;line-height:1}
.gl-hd p{margin:8px 0 0;font-size:18px;color:var(--ink2);max-width:46em;text-wrap:pretty}
.gl-key{padding:0 24px 12px;font-size:14px;color:var(--ink3);display:flex;gap:8px 18px;align-items:center;flex-wrap:wrap}
.gl-key span{display:flex;align-items:center;gap:7px}
.gl-rows{padding:0 12px 16px}
.gl-more{margin:10px 12px 0}
.gl-row{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,2fr) 128px 118px;gap:18px;align-items:center;padding:12px;border-top:1px solid var(--stone);text-decoration:none}
.gl-row:hover{background:var(--stone2)}
.gl-l b{display:block;font-size:16.5px;line-height:1.25}
.gl-l small{display:block;font-size:13px;color:var(--ink3)}
.gl-lad svg{display:block;width:100%;height:auto}
.gl-v{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.gl-v .num{font-size:21px}
.gl-v small{font-size:13px;color:var(--ink3)}
.gl-p{font-size:14px;font-weight:700;text-align:left}
.gl-na{font-size:14px;color:var(--ink3);display:flex;align-items:center;gap:10px}
.hatch{display:inline-block;width:64px;height:14px;border-radius:99px;background:repeating-linear-gradient(135deg,var(--stone) 0 5px,transparent 5px 10px);box-shadow:inset 0 0 0 1.5px var(--stone)}

/* doors */
.doors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;padding-top:22px}
.door{position:relative;padding:22px;display:flex;flex-direction:column;gap:10px;min-height:250px;border:var(--line);border-top-left-radius:56px;overflow:hidden;background:var(--card);text-decoration:none}
.door .mg{position:absolute;top:-34px;left:-34px;pointer-events:none}
.door .mt{font-family:var(--disp);font-weight:700;font-size:32px;line-height:1;margin-top:58px;position:relative}
.door p{margin:0;font-size:15px;color:var(--ink2);flex:1;position:relative}
.door:hover{background:var(--stone2)}
.more{display:flex;gap:10px;flex-wrap:wrap;padding-top:18px}
.routes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:36px;border-top:var(--line)}
.route{padding:20px 24px 4px 0;display:flex;flex-direction:column;gap:8px}
.route + .route{border-inline-start:var(--line);padding-inline-start:24px}
.route:first-child{padding-inline-start:0}
.route h3{margin:0;font-size:17px}
.route a{font-size:15px;color:var(--ink2);text-underline-offset:4px;display:flex;align-items:center;min-height:44px}

/* topic modules */
.mods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;padding-top:22px}
.mod{position:relative;padding:22px;display:flex;flex-direction:column;gap:12px;min-height:380px;border:var(--line);border-top-left-radius:56px;overflow:hidden;background:var(--card);text-decoration:none}
.mod:hover{background:var(--stone2)}
.mod .mg{position:absolute;top:-34px;left:-34px;pointer-events:none}
.mod .mt{font-family:var(--disp);font-weight:700;font-size:34px;line-height:.98;max-width:7em;margin-top:52px;position:relative}
.mod .mc{font-weight:700;font-size:13.5px;color:var(--ink2)}
.mod .ml{margin:0;font-size:15px;color:var(--ink2);flex:1}
.mod .ms{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:var(--line)}
.mod .msl{font-size:13.5px;font-weight:700}
.mod.x{background:var(--blu);color:var(--onblu);border-color:var(--blu)}
.mod.x .ml{color:var(--onblu);opacity:.9}
.mod.x .lnk i{background:var(--onblu)}
.mb{display:flex;flex-direction:column;gap:6px}
.mbr{display:grid;grid-template-columns:44px minmax(0,1fr) 84px;align-items:center;gap:8px}
.mbr .bl{font-size:12.5px;font-weight:700}
.mbr .bt{height:16px;position:relative}
.mbr .bt i{position:absolute;top:0;bottom:0;right:0;display:block;border-radius:999px 0 0 999px;min-width:6px}
.mbr .bv{font-size:15px;text-align:left}
.mbr.o .bv{color:var(--ink3)}

/* extremes */
.ext{display:grid;grid-template-columns:1fr 1fr}
.exc{padding-block:26px 30px;display:flex;flex-direction:column}
.exc:first-child{padding-inline-end:28px}
.exc + .exc{padding-inline-start:28px;border-inline-start:var(--line)}
.exc h3{margin:0 0 12px;display:flex;align-items:center;gap:12px;font-family:var(--disp);font-weight:700;font-size:30px}
.exi{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:16px;align-items:center;padding-block:13px;border-top:var(--line);text-decoration:none}
.exi:hover .nm{text-decoration:underline;text-underline-offset:4px}
.exi .rk{font-family:var(--num);font-weight:700;font-size:22px;direction:ltr;text-align:right}
.exi .rk small{font-size:12px;color:var(--ink3);font-weight:500}
.exi .nm{font-weight:700;font-size:16.5px;line-height:1.3}
.exi .nm small{display:block;font-weight:400;font-size:13.5px;color:var(--ink3);margin-top:2px}
.exi .vv{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.exi .vv .num{font-size:22px}
.exi .vv span:last-child{font-size:13px;color:var(--ink3)}

/* topic page rows */
.trows{display:flex;flex-direction:column}
.trw{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,2fr) minmax(0,1.5fr) auto;gap:16px 26px;align-items:center;padding-block:18px;border-bottom:var(--line)}
.trw .a{display:flex;flex-direction:column;gap:6px;min-width:0}
.trw .a b{font-size:18px;line-height:1.25}
.trw .a .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--ink3)}
.trw .a p{margin:0;font-size:14.5px;color:var(--ink2)}
.trw .c{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.trw .c svg{display:block;width:100%;height:auto;max-width:280px}
.trw .d{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;width:196px}
.hours{margin-top:30px;border:var(--line);border-top-left-radius:56px;background:var(--card);padding:26px 26px 22px 56px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px 40px}
.hours h2{margin:0 0 8px;font-size:34px}
.hours p{margin:0;font-size:15.5px;color:var(--ink2)}
.fcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}

/* compare page */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:var(--line)}
.st{display:flex;align-items:center;gap:22px;padding-block:24px;padding-inline-end:26px;min-height:190px;min-width:0}
.st + .st{border-inline-start:var(--line);padding-inline-start:26px}
.st .sl{font-weight:700;font-size:14.5px}
.st .sv{font-size:clamp(44px,4.4vw,64px);line-height:1}
.st .ss{font-size:14px;color:var(--ink2)}
.st svg{flex:0 0 auto}
.rkg{display:grid;grid-template-columns:repeat(10,12px);gap:4px;flex:0 0 auto}
.rkg i{display:block;width:12px;height:12px;border:2px solid var(--ink3);border-radius:50%}
.rkg i.il{background:var(--blu);border-color:var(--blu)}
.ib{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);border-bottom:var(--line)}
.chartm{padding-block:26px 34px;padding-inline-end:34px;border-inline-end:var(--line);min-width:0}
.chartm h2{margin:0;font-family:var(--disp);font-weight:700;font-size:32px}
.ctl{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin:16px 0 18px}
.ctl .g{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ctl .gl2{font-weight:700;font-size:13px;color:var(--ink3);margin-inline-end:4px}
.sel{appearance:none;height:44px;padding-inline:18px 40px;border:var(--line);border-radius:99px;background:transparent;font-weight:700;font-size:15px;max-width:100%;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:18px 50%,24px 50%;background-size:6px 6px;background-repeat:no-repeat;cursor:pointer}
.sel option,.sel optgroup{background:var(--card);color:var(--ink)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font-weight:700;font-size:13px;color:var(--ink3)}
.gwhy{font-size:13.5px;color:var(--ink3);margin:-8px 0 14px}
.rbars{position:relative;padding-top:34px;--lw:118px}
.rr{display:grid;grid-template-columns:var(--lw) minmax(0,1fr);gap:14px;align-items:center;height:28px;cursor:pointer;border-radius:6px}
.rr:hover{background:var(--stone2)}
.rr .cn{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr .tr{position:relative;height:16px}
.rr .tr i{position:absolute;top:0;bottom:0;display:block;background:var(--bar)}
.rr .tr i.pos{border-radius:999px 0 0 999px}
.rr .tr i.neg{border-radius:0 999px 999px 0}
.rr .tr span{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--num);font-weight:500;font-size:11.5px;color:var(--ink3);white-space:nowrap;direction:ltr;background:var(--paper);padding-inline:3px;border-radius:4px;line-height:1.3}
.rr:hover .tr span{background:var(--stone2)}
.rr.il .tr span.in,.rr.gr .tr span.in{background:none}
.rr.il .tr span.in{color:var(--onblu)}
.rr.gr .tr span.in{color:var(--onblu)}
.rr.il .cn{font-weight:700}
.rr.il .tr i{background:var(--blu)}
.rr.il .tr span{color:var(--ink);font-weight:700;font-size:13px}
.rr.gr .cn{font-weight:700}
.rr.gr .tr i{background:var(--red)}
.rr.gr .tr span{color:var(--ink)}
.oel{position:absolute;top:30px;bottom:0;width:0;border-right:2.5px solid var(--ink);pointer-events:none}
.oel span{position:absolute;top:-30px;transform:translateX(50%);white-space:nowrap;font-weight:700;font-size:13px;background:var(--paper);border:var(--line);padding:1px 10px;border-radius:99px}
.zl{position:absolute;top:34px;bottom:0;width:0;border-right:1px solid var(--ink3);pointer-events:none}
.miss{font-size:13.5px;color:var(--ink3);margin:14px 0 0}
.sidem{display:flex;flex-direction:column;min-width:0}
.sb{padding:24px 26px 26px;padding-inline-end:0;border-bottom:var(--line);display:flex;flex-direction:column;gap:12px}
.sb:last-child{border-bottom:0}
.sb h3{margin:0;font-family:var(--disp);font-weight:700;font-size:26px}
.sb p{margin:0;font-size:15px;color:var(--ink2)}
.sb.w{background:var(--blush);padding-inline-end:26px}
.sb.w p{color:var(--ink)}
.cbtn{all:unset;cursor:pointer;align-self:flex-start;height:44px;padding-inline:18px;border-radius:99px;display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px;background:var(--ink);color:var(--onink)}
.cbtn.s2{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.cbtn i{width:10px;height:10px;border-radius:50%;background:var(--sky);display:block}
.mapm{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);border-bottom:var(--line)}
.mapm .mm{padding-block:28px;padding-inline-end:32px;border-inline-end:var(--line);min-width:0}
.mapm .ms{padding-block:28px;padding-inline-start:28px;display:flex;flex-direction:column;gap:12px;min-width:0}
.mapm h3{margin:0;font-family:var(--disp);font-weight:700;font-size:34px}
.mapm p{margin:0;color:var(--ink2);font-size:15px}
.tmap{position:relative;width:100%;aspect-ratio:11/7.75;container-type:inline-size;direction:ltr}
.tl{position:absolute;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;cursor:default}
.tl b{font-family:var(--num);font-weight:600;font-size:1.75cqw;letter-spacing:.02em}
.tl small{font-family:var(--num);font-size:1.55cqw;font-weight:500}
.tl:not(.nd){box-shadow:inset 0 0 0 1.5px var(--bar)}
.tl.nd{background:repeating-linear-gradient(135deg,var(--stone2) 0 5px,var(--paper) 5px 10px);color:var(--ink3)}

עונות ובמשפחתונים. בגנים נספרות רק הגננות, וגננת שמלמדת בכמה גנים נספרת בכל אחד מהם.","EAG 2026, Table D2.1; Sources, Methodologies and Technical Notes, עמ' 109"],["כמה משלמים ההורים","סבסוד שעובר דרך המשפחות יכול להיספר כהוצאה פרטית. כמה יוצא מכיס ההורים בפועל, לא ידוע.","EAG 2026, עמ' 306"],["הכפלה שהיא שינוי שיטה","הרישום מתחת לגיל 3 קפץ מ-28% ל-56% בשנה אחת, 2016, השנה שבה ישראל שינתה את שיטת האיסוף. מאז הוא כמעט לא זז. EAG 2026 מתאר \"יותר מהכפלה\" ומייחס אותה למדיניות, בלי לסמן שבר. גם אילו מסגרות בדיוק נכללות, למשל משפחתונים, לא מפורט.","EAG 2023, Sources, Methodologies and Technical Notes, עמ' 45; Building Quality ECEC for Children under Three, Figure 2.1; EAG 2026, עמ' 188"],["מוערכות או לא","דף ישראל פותח במשפט הכללי של כל דפי המדינות, שהצוות \"אינו מרגיש מוערך בחברה\". מיד אחריו הוא מדווח ש-75% בגנים ו-76% במעונות מרגישים מוערכים, שיעור נמוך רק ביחס לשביעות הרצון מהעבודה (96%). בהשוואה בין המערכות, אלה מהשיעורים הגבוהים בסקר.","TALIS Starting Strong 2024, Figure 8.2, עמ' 188; דף ישראל, עמ' 3"],["נתוני צוות חריגים במעונות","לפי דיווח המנהלות: 0.5 אנשי צוות לכל 10 ילדים, 44% שעזבו בשנה, 60% חדשים ו-27% בחופשת מחלה ביום נתון. כולם חריגים מאוד מול שאר המערכות. השערה: מספר אנשי הצוות דווח בחסר. אין לצטט את המספרים האלה בלי בדיקה נוספת.","TALIS Starting Strong 2024, Figures 3.6, 3.9 (StatLinks 5hv1ts, jlezf1)"],["מה הילדים יודעים","ישראל לא השתתפה ב-IELS, הסקר של ה-OECD על למידה ורווחה של ילדים בני 5. אין השוואה בינלאומית של תוצאות אצל ילדים בישראל.","OECD, IELS 2025, Building Strong Foundations for Life"],["פערים בין המקורות","דף ישראל של TALIS Starting Strong כותב ששביעות הרצון בישראל \"הגבוהה ביותר\", והטבלה מראה את ספרד גבוה ממנה (97% מול 96%). ההערות הטכניות כותבות שגננת מלמדת 36.5 שבועות, והטבלה 38. בזמן התכנון, דף ישראל מדווח על תכנון לבד (26% בגנים) והטבלה על תכנון לבד ועם עמיתים (44%).","TALIS Starting Strong 2024, Table 1.2, עמ' 38; Table 4.1, עמ' 98; דף ישראל, עמ' 2-3; EAG 2026, Table D4.1; Sources, Methodologies and Technical Notes, עמ' 324"]],"sour (function(){const q=$('#q'),box=$('#qres');let items=[],on=-1;

  const syn=i=>{const th=themeOf(i.id).id;let w=SYN[th]||'';if(/PISA/.test(i.source))w+=' pisa פיזה';if(/TALIS/.test(i.source))w+=' talis טאליס';return w;};
  const pool=[...D.indicators.map(i=>({t:i.title,sub:SHORT[themeOf(i.id).id],href:'#c-'+i.id,k:norm(i.title+' '+(SHORTL[i.id]||'')+' '+i.short+' '+syn(i))})),

    const ws=v.split(' ');items=pool.filter(p=>ws.every(w=>p.k.includes(w))).slice(0,8);on=items.length?0:-1;
